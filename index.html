<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>嶼慢時刻 | Yuman Moments</title>

<style>
body{
font-family:"Noto Sans TC",sans-serif;
margin:0;
background:#fffaf7;
color:#333;
text-align:center;
}

.hero{
padding:60px 20px;
background:#f4ede6;
}

.hero img{
width:200px;
border-radius:20px;
}

h1{margin:10px 0;}

.subtitle{color:#666;}

.btn{
display:inline-block;
margin:10px;
padding:12px 20px;
background:#c48b5a;
color:white;
border-radius:25px;
text-decoration:none;
}

.section{padding:50px 20px;}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.gallery img{
width:100%;
border-radius:12px;
cursor:pointer;
}

.product{
background:white;
margin:10px;
padding:15px;
border-radius:12px;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

.price{line-height:1.8;}

.lightbox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:10px;
}
</style>
</head>

<body>

<div class="hero">

<div class="lightbox" id="lightbox" onclick="closeImg()">

<script>

document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=src;
}

function closeImg(){
document.getElementById("lightbox").style.display="none";
}
</script>

</html>
