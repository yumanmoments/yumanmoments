<style>
body{

margin:0;
background:#fffaf7;

}

.hero{
padding:60px 20px;
background:#f4ede6;
}

.hero img{
width:220px;

}

h1{margin:10px 0;}

.subtitle{color:#666;margin-bottom:10px;}

.limit{color:#c48b5a;font-weight:bold;margin-bottom:20px;}

.btn{
display:inline-block;
padding:14px 26px;

color:white;
border-radius:30px;
text-decoration:none;
box-shadow:0 6px 15px rgba(0,0,0,0.15);

}

.btn:hover{
transform:translateY(-3px);

}

.section{
padding:50px 20px;
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.gallery img{
width:100%;
border-radius:12px;
cursor:pointer;
transition:0.3s;
}

.gallery img:hover{

}

.price{

}

.note{

margin-top:10px;

/* 放大圖片 */
.lightbox{

left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
