<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>嶼慢時刻 | Yuman Moments</title>

<style>
body{
font-family:"Noto Sans TC",sans-serif;
margin:0;
background:#fffaf7;
color:#333;
text-align:center;
}

.hero{
padding:60px 20px;
background:#f4ede6;
}

.hero img{
width:220px;
border-radius:20px;
}

h1{margin:10px 0;}

.subtitle{color:#666;}

.limit{
color:#c0392b;
font-weight:bold;
margin:15px 0;
}

.btn{
display:inline-block;
margin:10px;
padding:14px 26px;
background:#c48b5a;
color:white;
border-radius:30px;
text-decoration:none;
}

.section{
padding:50px 20px;
}

.gallery{
display:flex;
overflow-x:auto;
gap:12px;
padding:20px;
}

.gallery img{
height:200px;
border-radius:12px;
cursor:pointer;
}

.product{
background:white;
margin:10px;
padding:20px;
border-radius:12px;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

.price{line-height:1.8;}

.lightbox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:10px;
}
</style>

</head>

<body>

<!-- 🌊 品牌 -->
<div class="hero">
<img src="hero.jpg.jpg">
<h1>嶼慢時刻</h1>
<p class="subtitle">慢慢品味島嶼的甜</p>

<p class="limit">🔥 端午限定甜時粽｜早鳥優惠中</p>

<a class="btn" href="https://ig.me/m/yuman.moments">
立即預訂甜時粽
</a>
</div>

<!-- 🔥 主打商品 -->
<div class="section">
<h2>端午限定｜嶼慢甜時粽</h2>

<div class="gallery">
<img src="zong1.jpg.PNG" onclick="openImg(this.src)">
<img src="zong2.jpg.jpg" onclick="openImg(this.src)">
<img src="zong3.jpg.PNG" onclick="openImg(this.src)">
<img src="zong4.jpg.PNG" onclick="openImg(this.src)">
</div>

<div class="product">
<p class="price">
單顆 $80<br>
夜嶼金沙 $100<br><br>

2入 $168｜早鳥 $150<br>
4入 $328｜早鳥 $298<br>
6入 $468｜早鳥 $420
</p>

<a class="btn" href="https://ig.me/m/yuman.moments?text=我要訂購甜時粽">
立即下單
</a>
</div>
</div>

<!-- 🍰 雪Q餅（放後面） -->
<div class="section">
<h2>人氣雪Q餅</h2>

<div class="gallery">
<img src="p1.jpg.PNG" onclick="openImg(this.src)">
<img src="p2.jpg.PNG" onclick="openImg(this.src)">
<img src="p3.jpg.PNG" onclick="openImg(this.src)">
</div>

<div class="product">
<p class="price">
9顆 $180<br>
12顆 $280<br>
16顆 $480<br>
20顆 $620
</p>

<a class="btn" href="https://ig.me/m/yuman.moments?text=我要訂購雪Q餅">
立即下單
</a>
</div>
</div>

<!-- 放大圖片 -->
<div class="lightbox" id="lightbox" onclick="closeImg()">
<img id="lightbox-img">
</div>

<script>
function openImg(src){
document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=src;
}

function closeImg(){
document.getElementById("lightbox").style.display="none";
}
</script>

</body>
</html>
