<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>嶼慢時刻 | Yuman Moments</title>

<style>
body{
font-family:"Noto Sans TC",sans-serif;
margin:0;
background:#fffaf7;
color:#333;
text-align:center;
}

.hero{
padding:80px 20px;
background:#f4ede6;
}

.hero img{
width:260px;
border-radius:20px;
}

.hero h1{
font-size:42px;
}

.subtitle{
opacity:0.7;
}

.btn{
display:inline-block;
margin:15px;
padding:14px 30px;
background:#d19a66;
color:white;
border-radius:30px;
text-decoration:none;
}

.section{
padding:60px 20px;
}

.gallery{
display:flex;
overflow-x:auto;
gap:12px;
padding:20px;
}

.gallery img{
height:180px;
border-radius:12px;
cursor:pointer;
}

.menu-img{
width:90%;
max-width:400px;
border-radius:12px;
margin:20px auto;
cursor:pointer;
}

.price{
line-height:2;
font-size:18px;
}

.note{
font-size:14px;
opacity:0.7;
}

.limit{
color:#c0392b;
font-weight:bold;
}

/* 放大圖 */
.modal{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
}

.modal img{
max-width:90%;
max-height:90%;
margin-top:5%;
border-radius:12px;
}
</style>

</head>

<body>

<div class="hero">
<img src="hero.jpg.jpg">
<h1>嶼慢時刻</h1>
<p class="subtitle">慢慢品味島嶼的甜</p>

<p class="limit">⚠ 本週限量製作，售完為止</p>

<a class="btn" href="https://ig.me/m/yuman.moments">
立即IG私訊訂購
</a>

<p class="note">
點擊後可直接傳訊：<br>
「我要訂購＋商品＋數量＋取貨方式」
</p>

</div>

<div class="section">
<h2>人氣甜點</h2>

<div class="gallery">
<img src="p1.jpg.PNG" onclick="openImg(this)">
<img src="p2.jpg.PNG" onclick="openImg(this)">
<img src="p3.jpg.PNG" onclick="openImg(this)">
</div>
</div>

<div class="section">
<h2>雪Q餅系列</h2>
<img src="s1.jpg.PNG" class="menu-img" onclick="openImg(this)">
</div>

<div class="section">
<h2>茶點系列</h2>
<img src="s2.jpg.PNG" class="menu-img" onclick="openImg(this)">
</div>

<div class="section">
<h2>海岸風味</h2>
<img src="s3.jpg.PNG" class="menu-img" onclick="openImg(this)">
</div>

<div class="section">
<h2>商品價格</h2>

<p class="price">
<b>🥡 袋裝</b><br><br>
嶼見甜 9顆 $180<br>
嶼見慢 12顆 $280<br><br>

<b>🎁 禮盒</b><br><br>
嶼見心動 16顆 $480<br>
嶼見時光 20顆 $620
</p>
</div>

<div class="section">
<a class="btn" href="https://ig.me/m/yuman.moments">
立即私訊訂購
</a>
</div>

<div id="imgModal" class="modal" onclick="closeImg()">
<img id="modalImg">
</div>

<script>
function openImg(img){
document.getElementById("imgModal").style.display="block";
document.getElementById("modalImg").src=img.src;
}

function closeImg(){
document.getElementById("imgModal").style.display="none";
}
</script>

</body>
</html>
